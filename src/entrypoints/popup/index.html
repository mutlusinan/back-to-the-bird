<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Back to the Bird</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="bar"><h1 id="title"></h1></header>
    <main>
      <section id="eraSection">
        <h2 id="eraTitle"></h2>
        <div id="eras" class="eras" role="radiogroup" aria-labelledby="eraTitle"></div>
      </section>
      <section>
        <h2 id="featuresTitle"></h2>
        <ul id="toggles" class="list"></ul>
      </section>
      <section>
        <h2 id="healthTitle"></h2>
        <ul id="health" class="list"></ul>
      </section>
      <div class="actions">
        <button id="showOriginal" type="button" class="primary"></button>
        <button id="copyReport" type="button"></button>
        <button id="takeSnapshot" type="button" hidden></button>
        <p id="copyStatus" class="note" aria-live="polite"></p>
      </div>
    </main>
    <footer class="note"><span id="version"></span> · <a id="repo" href="https://github.com/mutlusinan/back-to-the-bird" target="_blank" rel="noreferrer">GitHub</a></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
